<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muay Premium — แอปพรีเมียมราคาดี ได้ของทันที</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* ===== หน้าร้าน ===== */
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; gap: 14px; height: 64px; }
  .shop-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
  .shop-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search input { padding-left: 40px; background: var(--surface-2); border-color: transparent; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .top-acts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .wallet-chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
  .badge { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #a78bfa); color: #fff; display: grid; place-items: center; font-weight: 600; }
  main.wrap { padding-top: 24px; padding-bottom: 64px; min-height: 70vh; }

  /* หน้าแรก */
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: center; padding: 36px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .hero::after { content: ''; position: absolute; right: -120px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(var(--accent-soft), transparent 70%); pointer-events: none; }
  .hero h1 { font-size: clamp(28px, 4vw, 42px); }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { color: var(--muted); margin: 12px 0 22px; font-size: 16px; }
  .hero-acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-ticks { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .hero-ticks span::before { content: '✓ '; color: var(--ok); font-weight: 700; }
  .hero-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; position: relative; z-index: 1; }
  .hero-art .applogo { width: 100%; height: auto; aspect-ratio: 1; border-radius: 22px; font-size: 30px; box-shadow: var(--shadow); }
  .hero-art .applogo:nth-child(2n) { transform: translateY(16px); }
  .live { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .live b { color: var(--text); font-weight: 500; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px var(--ok-soft); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .stat { padding: 16px 18px; }
  .stat b { display: block; font-family: var(--font-head); font-size: 24px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .sec { margin-top: 36px; }
  .sec-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 14px; }
  .sec-head h2 { font-size: 21px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { flex: none; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .pcard { overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .pcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .pcard-img { position: relative; }
  .pcard-img .tag { position: absolute; top: 10px; left: 10px; }
  .pcard.out .pcard-img::after { content: 'หมดชั่วคราว'; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 17, 23, .55); color: #fff; font-weight: 600; }
  .pcard-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .pcard-name { font-weight: 600; }
  .pcard-price { font-family: var(--font-head); font-size: 18px; color: var(--accent); font-weight: 700; }
  .pcard-price small { font-family: var(--font); font-size: 12px; color: var(--muted); font-weight: 400; }
  .pcard-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: auto; padding-top: 6px; }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .how .card { padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .how-n { width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .how b { display: block; }
  .how span { font-size: 14px; color: var(--muted); }

  /* หน้าสินค้า */
  .crumb { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .crumb a:hover { color: var(--accent); }
  .pd { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
  .pd-media { position: sticky; top: 88px; overflow: hidden; }
  .pd h1 { font-size: 28px; margin: 6px 0 4px; }
  .pd-sub { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
  .plan { text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .plan.on { border-color: var(--accent); background: var(--accent-soft); }
  .plan b { font-family: var(--font-head); font-size: 20px; }
  .plan s { font-size: 13px; color: var(--faint); }
  .buy-bar { display: flex; gap: 10px; }
  .buy-bar .btn { flex: 1; }
  .perks { margin-top: 22px; display: grid; gap: 10px; }
  .perk { display: flex; gap: 12px; align-items: center; padding: 12px 14px; font-size: 14px; }
  .perk i { font-style: normal; font-size: 20px; }
  .desc { margin-top: 18px; padding: 18px; }
  .desc h3 { font-size: 16px; margin-bottom: 6px; }

  /* ตะกร้า / ชำระเงิน */
  .co { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .line-item { display: flex; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .line-item:last-child { border-bottom: 0; }
  .line-item .grow { flex: 1; min-width: 0; }
  .line-item small { color: var(--muted); display: block; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; }
  .qty button { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; }
  .sum-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
  .sum-row.total { color: var(--text); font-size: 18px; font-weight: 600; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 12px; }
  .sum-row.total b { color: var(--accent); font-family: var(--font-head); font-size: 24px; }
  .pay-opt { display: flex; gap: 12px; align-items: center; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; margin-bottom: 10px; }
  .pay-opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .pay-opt .grow { flex: 1; }
  .pay-opt small { display: block; color: var(--muted); }
  .pay-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 20px; }
  .steps { display: flex; gap: 8px; margin-bottom: 18px; }
  .step { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
  .step.on { background: var(--accent); }
  .qr { width: 230px; margin: 4px auto 12px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); text-align: center; background: #fff; color: #111; }
  .qr-head { background: #113566; color: #fff; padding: 8px; font-weight: 600; font-size: 13px; }
  .qr-box { padding: 14px; }
  .qr-amt { font-weight: 700; font-size: 20px; padding-bottom: 10px; }
  .timer { text-align: center; font-size: 14px; color: var(--muted); }
  .timer b { color: var(--accent); font-size: 17px; }
  .drop { margin-top: 14px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; background: var(--surface-2); }
  .drop:hover { border-color: var(--accent); }
  .success { text-align: center; padding: 32px 20px; }
  .success-ic { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: 34px; }

  /* บัญชีของฉัน */
  .subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .sub { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .sub-top { display: flex; gap: 12px; align-items: center; }
  .sub-top .grow { flex: 1; }
  .sub-top small { color: var(--muted); display: block; }
  .days { display: flex; justify-content: space-between; align-items: baseline; }
  .days b { font-family: var(--font-head); font-size: 26px; color: var(--accent); }
  .sub.warn .days b { color: var(--warn); }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .sub.warn .bar i { background: var(--warn); }
  .sub.off { opacity: .6; }
  .secret { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
  .secret span { color: var(--muted); }
  .secret code { font-family: ui-monospace, monospace; font-size: 14px; overflow-wrap: anywhere; }
  .copy { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; }
  .sub-acts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ออเดอร์ */
  .orders .row { display: grid; grid-template-columns: 120px 1fr 110px 120px; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .orders .row:last-child { border: 0; }
  .orders .row.head { font-size: 12px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding-top: 10px; padding-bottom: 10px; }

  /* เมนูล่างมือถือ + ปุ่ม LINE */
  .tabbar { display: none; }
  .line-fab { position: fixed; z-index: 30; right: 18px; bottom: 76px; width: 52px; height: 52px; border-radius: 50%; background: #06c755; color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(6, 199, 85, .35); font-weight: 700; font-size: 13px; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 36px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 860px) {
    .hero, .pd, .co { grid-template-columns: 1fr; }
    .hero { padding: 22px; }
    .hero-art { grid-template-columns: repeat(6, 1fr); gap: 8px; order: -1; }
    .hero-art .applogo { border-radius: 14px; font-size: 16px; }
    .hero-art .applogo:nth-child(2n) { transform: none; }
    .pd-media { position: static; max-width: 280px; }
    .how { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .search, .wallet-chip, .desk { display: none; }
    .top-row { height: 58px; }
    .stats .stat { padding: 12px; } .stat b { font-size: 19px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--faint); position: relative; }
    .tabbar a.on { color: var(--accent); font-weight: 600; }
    .tabbar svg { width: 22px; height: 22px; }
    .tabbar .badge { top: -4px; right: calc(50% - 20px); }
    body { padding-bottom: 70px; }
    .orders .row { grid-template-columns: 1fr auto; }
    .orders .row > :nth-child(3) { display: none; }
    .orders .row.head { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a href="#home" class="shop-brand"><span class="shop-mark">M</span>Muay Premium</a>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="input" placeholder="ค้นหาแอป เช่น Netflix, YouTube" aria-label="ค้นหา" oninput="filterSearch(this.value)">
    </label>
    <div class="top-acts">
      <a href="#wallet" class="wallet-chip" title="เติมเงิน">💳 ฿250</a>
      <a href="#cart" class="icon-btn" aria-label="ตะกร้า">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0"/></svg>
        <span class="badge" id="cartCount">1</span>
      </a>
      <a href="#my" class="icon-btn desk" aria-label="บัญชีของฉัน"><span class="avatar">ป</span></a>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer>
  <div class="wrap">
    <span>© 2026 Muay Premium · ร้านค้าบน <b>SysRent</b></span>
    <span><a href="#home">หน้าแรก</a> · <a href="#orders">ออเดอร์</a> · เงื่อนไขการใช้งาน</span>
  </div>
</footer>

<a class="line-fab" href="#" onclick="toast('เปิด LINE ของร้าน'); return false;" aria-label="ติดต่อร้านทาง LINE">LINE</a>

<nav class="tabbar" aria-label="เมนูหลัก">
  <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>หน้าแรก</a>
  <a href="#home" data-nav="p" onclick="setTimeout(()=>document.getElementById('cat')?.scrollIntoView({behavior:'smooth'}),50)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>สินค้า</a>
  <a href="#cart" data-nav="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0"/></svg>ตะกร้า<span class="badge" id="cartCount2">1</span></a>
  <a href="#my" data-nav="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 11h12v10H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg>บัญชีของฉัน</a>
  <a href="#orders" data-nav="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>ออเดอร์</a>
</nav>

<script src="assets/app.js"></script>
<script>
  let cart = [{ app: 'netflix', plan: 1 }];
  let pick = 1;
  let catFilter = 'ทั้งหมด';
  const cartTotal = () => cart.reduce((s, c) => s + APPS[c.app].plans[c.plan].price, 0);
  const syncCount = () => { $('#cartCount').textContent = cart.length; $('#cartCount2').textContent = cart.length; $('#cartCount').style.display = $('#cartCount2').style.display = cart.length ? '' : 'none'; };

  function productCard(key) {
    const a = APPS[key], from = Math.min(...a.plans.map((p) => p.price));
    return `<a href="#p/${key}" class="card pcard${a.left ? '' : ' out'}" data-name="${a.name.toLowerCase()}">
      <div class="pcard-img">${logo(key, 'xl')}${a.badge ? `<span class="pill accent plain tag">${a.badge}</span>` : ''}</div>
      <div class="pcard-body">
        <span class="pcard-name">${a.name}</span>
        <span class="pcard-price"><small>เริ่ม </small>${baht(from)}</span>
        <span class="pcard-meta"><span>${a.left ? `เหลือ ${a.left}` : 'หมด'}</span><span>ขายแล้ว ${a.sold.toLocaleString('th-TH')}</span></span>
      </div></a>`;
  }
  function filterSearch(q) {
    if (!location.hash.startsWith('#home') && location.hash) location.hash = 'home';
    setTimeout(() => $$('.pcard').forEach((c) => c.classList.toggle('hide', !c.dataset.name.includes(q.toLowerCase().trim()))), 0);
  }
  function setCat(c) { catFilter = c; $('#view').innerHTML = pages.home(); }

  const pages = {
    home() {
      const cats = ['ทั้งหมด', ...new Set(Object.values(APPS).map((a) => a.cat))];
      const keys = Object.keys(APPS).filter((k) => catFilter === 'ทั้งหมด' || APPS[k].cat === catFilter);
      return `
      <section class="hero">
        <div>
          <span class="pill accent plain">✨ ส่งอัตโนมัติ 24 ชั่วโมง</span>
          <h1 style="margin-top:12px">แอปพรีเมียมราคาดี<br><em>จ่ายแล้วได้ทันที</em></h1>
          <p>Netflix, YouTube, Disney+, Spotify และอีกมากมาย สแกนจ่ายพร้อมเพย์ ระบบตรวจสลิปและส่งรหัสให้เองภายในไม่กี่วินาที</p>
          <div class="hero-acts"><a href="#home" class="btn primary lg" onclick="setTimeout(()=>document.getElementById('cat').scrollIntoView({behavior:'smooth'}),50)">เลือกซื้อเลย</a><a href="#my" class="btn lg">บัญชีของฉัน</a></div>
          <div class="hero-ticks"><span>ตรวจสลิปอัตโนมัติ</span><span>รับประกันตลอดอายุ</span><span>ดูแลทาง LINE</span></div>
        </div>
        <div class="hero-art">${['netflix', 'youtube', 'disney', 'spotify', 'chatgpt', 'canva'].map((k) => logo(k)).join('')}</div>
      </section>
      <div class="live"><span class="live-dot"></span><span><b>@pl***y</b> ซื้อ Netflix 30 วัน · 2 นาทีที่แล้ว</span><span class="faint">•</span><span><b>@no***k</b> สมัครสมาชิก · 5 นาทีที่แล้ว</span></div>
      <div class="stats">
        <div class="card stat"><b class="num">2,184</b><span>สมาชิก</span></div>
        <div class="card stat"><b class="num">4,267</b><span>ขายไปแล้ว</span></div>
        <div class="card stat"><b class="num">97</b><span>พร้อมส่งตอนนี้</span></div>
      </div>
      <section class="sec" id="cat">
        <div class="sec-head"><h2>สินค้าทั้งหมด</h2><span class="muted" style="font-size:14px">${keys.length} รายการ</span></div>
        <div class="chips" style="margin-bottom:14px">${cats.map((c) => `<button class="chip${c === catFilter ? ' on' : ''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div>
        <div class="grid">${keys.map(productCard).join('')}</div>
      </section>
      <section class="sec">
        <div class="sec-head"><h2>ซื้อง่าย 3 ขั้นตอน</h2></div>
        <div class="how">
          <div class="card"><span class="how-n">1</span><div><b>เลือกแอปและแพ็กเกจ</b><span>มีให้เลือกตั้งแต่ 7 วันถึง 1 ปี</span></div></div>
          <div class="card"><span class="how-n">2</span><div><b>สแกนจ่ายพร้อมเพย์</b><span>อัปสลิป ระบบตรวจให้อัตโนมัติ</span></div></div>
          <div class="card"><span class="how-n">3</span><div><b>ได้รหัสทันที</b><span>ดูได้ที่ "บัญชีของฉัน" ตลอดอายุ</span></div></div>
        </div>
      </section>`;
    },

    p(key) {
      const a = APPS[key] || APPS.netflix; key = APPS[key] ? key : 'netflix';
      if (pick >= a.plans.length) pick = 0;
      const pl = a.plans[pick];
      return `
      <div class="crumb"><a href="#home">หน้าแรก</a> › ${a.cat} › ${a.name}</div>
      <div class="pd">
        <div class="card pd-media">${logo(key, 'xl')}</div>
        <div>
          ${a.badge ? `<span class="pill accent plain">${a.badge}</span>` : ''}
          <h1>${a.name}</h1>
          <div class="pd-sub"><span>⭐ 4.9 (312 รีวิว)</span><span>ขายแล้ว ${a.sold.toLocaleString('th-TH')}</span><span>${a.left ? `<span class="pill ok">พร้อมส่ง ${a.left}</span>` : '<span class="pill bad">หมดชั่วคราว</span>'}</span></div>
          <div class="plans" role="radiogroup" aria-label="แพ็กเกจ">
            ${a.plans.map((p, i) => `<button class="plan${i === pick ? ' on' : ''}" role="radio" aria-checked="${i === pick}" onclick="pick=${i};location.hash='p/${key}';dispatchEvent(new HashChangeEvent('hashchange'))">
              <span class="muted" style="font-size:14px">${p.name}</span><b>${baht(p.price)}</b>${p.old ? `<s>${baht(p.old)}</s>` : '<s>&nbsp;</s>'}</button>`).join('')}
          </div>
          <div class="buy-bar">
            <button class="btn lg" ${a.left ? '' : 'disabled'} onclick="cart.push({app:'${key}',plan:${pick}});syncCount();toast('ใส่ตะกร้าแล้ว 🛒')">ใส่ตะกร้า</button>
            <button class="btn primary lg" ${a.left ? '' : 'disabled'} onclick="cart=[{app:'${key}',plan:${pick}}];syncCount();location.hash='cart'">ซื้อเลย ${baht(pl.price)}</button>
          </div>
          <div class="perks">
            <div class="card perk"><i>⚡</i><span>จ่ายแล้วได้รหัสทันที ไม่ต้องรอแอดมิน</span></div>
            <div class="card perk"><i>🛡️</i><span>รับประกันตลอดอายุแพ็กเกจ ใช้ไม่ได้เปลี่ยนให้</span></div>
            <div class="card perk"><i>🔑</i><span>ขอรหัส OTP / ดูรหัสได้เองที่ "บัญชีของฉัน"</span></div>
          </div>
          <div class="card desc"><h3>รายละเอียด</h3><p class="muted" style="margin:0">${a.desc}</p></div>
        </div>
      </div>`;
    },

    cart(step) {
      if (step === 'paid') {
        return `<div class="card success" style="max-width:520px;margin:0 auto">
          <div class="success-ic">✓</div><h1 style="font-size:24px">ชำระเงินสำเร็จ!</h1>
          <p class="muted">ระบบจัดจอให้แล้ว ดูอีเมล รหัส และ PIN ได้ที่หน้า "บัญชีของฉัน"</p>
          <a href="#my" class="btn primary lg" style="margin-top:8px">ไปที่บัญชีของฉัน</a></div>`;
      }
      if (!cart.length) return `<div class="card success"><div class="success-ic" style="background:var(--surface-2);color:var(--muted)">🛒</div><h2>ตะกร้ายังว่าง</h2><p class="muted">เลือกแอปที่ชอบแล้วกดใส่ตะกร้าได้เลย</p><a href="#home" class="btn primary">ไปเลือกสินค้า</a></div>`;
      const paying = step === 'pay';
      return `
      <h1 style="font-size:26px;margin-bottom:16px">${paying ? 'ชำระเงิน' : 'ตะกร้าสินค้า'}</h1>
      <div class="co">
        <div class="card">
          <div class="card-head"><h3>รายการ (${cart.length})</h3>${paying ? '' : '<button class="btn ghost sm" onclick="cart=[];syncCount();location.hash=\'cart\';dispatchEvent(new HashChangeEvent(\'hashchange\'))">ล้างตะกร้า</button>'}</div>
          ${cart.map((c, i) => { const a = APPS[c.app], p = a.plans[c.plan]; return `
            <div class="line-item">${logo(c.app)}<div class="grow"><b>${a.name}</b><small>${p.name} · ระบบจัดจอให้อัตโนมัติ</small></div>
              <b class="num">${baht(p.price)}</b>${paying ? '' : `<button class="icon-btn" aria-label="ลบ" onclick="cart.splice(${i},1);syncCount();dispatchEvent(new HashChangeEvent('hashchange'))">✕</button>`}</div>`; }).join('')}
        </div>
        <div class="card card-pad">
          ${paying ? `
            <div class="steps"><span class="step on"></span><span class="step on"></span><span class="step"></span></div>
            <div class="qr"><div class="qr-head">พร้อมเพย์ · PromptPay</div><div class="qr-box">
              <svg viewBox="0 0 29 29" width="180" height="180" shape-rendering="crispEdges">${qrDemo()}</svg></div>
              <div class="qr-amt">${baht(cartTotal())}</div></div>
            <p class="timer">โอนภายใน <b id="tm">9:59</b> นาที · ยอดต้องตรงตาม QR</p>
            <label class="drop"><input type="file" accept="image/*" hidden onchange="this.closest('.drop').innerHTML='✅ เลือกสลิปแล้ว — กดยืนยันด้านล่าง'">📎 <b>แตะเพื่อเลือกรูปสลิป</b><br><span class="muted" style="font-size:13px">ระบบตรวจสลิปอัตโนมัติ ใช้เวลาไม่กี่วินาที</span></label>
            <button class="btn primary lg block" style="margin-top:14px" onclick="location.hash='cart/paid'">ยืนยันสลิป</button>
            <button class="btn ghost block" style="margin-top:6px" onclick="location.hash='cart'">← กลับ</button>`
          : `
            <h3 style="font-size:16px;margin-bottom:10px">สรุปยอด</h3>
            <div class="sum-row"><span>ราคาสินค้า</span><span class="num">${baht(cartTotal())}</span></div>
            <div class="sum-row"><span>ส่วนลด</span><span>—</span></div>
            <div class="sum-row total"><span>ยอดชำระ</span><b class="num">${baht(cartTotal())}</b></div>
            <h3 style="font-size:16px;margin:18px 0 10px">วิธีชำระเงิน</h3>
            <div class="pay-opt on" onclick="$$('.pay-opt').forEach(x=>x.classList.remove('on'));this.classList.add('on')"><span class="pay-ic">📱</span><span class="grow"><b>พร้อมเพย์ (QR)</b><small>สแกนจ่าย ตรวจสลิปอัตโนมัติ</small></span></div>
            <div class="pay-opt" onclick="$$('.pay-opt').forEach(x=>x.classList.remove('on'));this.classList.add('on')"><span class="pay-ic">💳</span><span class="grow"><b>กระเป๋าเงิน</b><small>คงเหลือ ฿250 · จ่ายทันที</small></span></div>
            <button class="btn primary lg block" style="margin-top:6px" onclick="location.hash='cart/pay'">ชำระเงิน ${baht(cartTotal())}</button>`}
        </div>
      </div>`;
    },

    my() {
      const subs = [
        { app: 'netflix', plan: '30 วัน', left: 27, total: 30, login: 'nf.muay02@gmail.com', pw: 'Mu4y#2026nf', prof: 'Muay-5', pin: '3364' },
        { app: 'youtube', plan: '30 วัน', left: 2, total: 30, login: 'เชิญเข้าครอบครัวแล้ว (อีเมลของคุณ)', pw: '—', prof: 'Family', pin: '' },
        { app: 'disney', plan: '30 วัน', left: 0, total: 30 },
      ];
      return `
      <div class="sec-head"><h1 style="font-size:26px">บัญชีของฉัน</h1><span class="muted" style="font-size:14px">แอปที่เช่าอยู่</span></div>
      <div class="subs">${subs.map((s, i) => {
        const a = APPS[s.app], tone = s.left === 0 ? 'off' : s.left <= 3 ? 'warn' : '';
        return `<article class="card sub ${tone}">
          <div class="sub-top">${logo(s.app)}<div class="grow"><b>${a.name}</b><small>แพ็กเกจ ${s.plan}</small></div>
            <span class="pill ${tone === 'off' ? '' : tone === 'warn' ? 'warn' : 'ok'}">${tone === 'off' ? 'หมดอายุ' : tone === 'warn' ? 'ใกล้หมด' : 'ใช้งานอยู่'}</span></div>
          ${s.left ? `<div class="days"><span>เหลือ <b class="num">${s.left}</b> วัน</span><span class="faint" style="font-size:13px">ถึง ${new Date(Date.now() + s.left * 864e5).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}</span></div>
            <div class="bar"><i style="width:${Math.max(4, (s.left / s.total) * 100)}%"></i></div>
            <div class="secret hide" id="sec${i}">
              <span>อีเมล</span><code>${s.login}</code><button class="copy" onclick="toast('คัดลอกแล้ว')">คัดลอก</button>
              <span>รหัสผ่าน</span><code>${s.pw}</code><button class="copy" onclick="toast('คัดลอกแล้ว')">คัดลอก</button>
              <span>โปรไฟล์</span><code>${s.prof}${s.pin ? ` · PIN ${s.pin}` : ''}</code><span></span>
            </div>
            <div class="sub-acts">
              <button class="btn primary sm" onclick="const e=$('#sec${i}');e.classList.toggle('hide');this.textContent=e.classList.contains('hide')?'👁 ดูรหัส':'ซ่อนรหัส'">👁 ดูรหัส</button>
              <button class="btn sm" onclick="toast('ส่งรหัส OTP แล้ว: 482913')">🔑 ขอ OTP</button>
              <button class="btn sm ${tone === 'warn' ? 'soft' : ''}" onclick="toast('ต่ออายุ — ได้จอเดิม')">🔄 ต่ออายุ</button>
              <button class="btn ghost sm" onclick="toast('เปิดฟอร์มแจ้งปัญหา')">⚠️ แจ้งปัญหา</button>
            </div>` : `<p class="muted" style="margin:0;font-size:14px">หมดอายุแล้ว — รหัสถูกซ่อนเพื่อความปลอดภัย</p><div class="sub-acts"><a href="#p/${s.app}" class="btn soft sm">🛒 ซื้อใหม่</a></div>`}
        </article>`; }).join('')}</div>
      <p class="muted" style="text-align:center;font-size:13px;margin-top:20px">ใช้เฉพาะโปรไฟล์ของคุณ ห้ามเปลี่ยนรหัสผ่าน / PIN · มีปัญหาทัก LINE ร้านได้ตลอด</p>`;
    },

    orders() {
      const rows = [
        ['#A8F2K1', 'Netflix Premium · 30 วัน', 99, 'ok', 'สำเร็จ', '2 นาทีที่แล้ว'],
        ['#7QX0PZ', 'YouTube Premium · 30 วัน', 59, 'ok', 'สำเร็จ', '28 ต.ค.'],
        ['#K2M9DD', 'Canva Pro · 30 วัน', 39, 'warn', 'รอชำระ', '27 ต.ค.'],
        ['#Z1LL0B', 'Disney+ · 30 วัน', 69, '', 'ยกเลิก', '1 ต.ค.'],
      ];
      return `<h1 style="font-size:26px;margin-bottom:16px">ออเดอร์ของฉัน</h1>
      <div class="card orders">
        <div class="row head"><span>เลขออเดอร์</span><span>รายการ</span><span>วันที่</span><span style="text-align:right">ยอด / สถานะ</span></div>
        ${rows.map((r) => `<div class="row"><span class="num" style="font-weight:600">${r[0]}</span><span>${r[1]}</span><span class="muted" style="font-size:14px">${r[5]}</span>
          <span style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b class="num">${baht(r[2])}</b><span class="pill ${r[3]}">${r[4]}</span></span></div>`).join('')}
      </div>`;
    },

    wallet() {
      return `<div style="max-width:520px;margin:0 auto">
        <div class="card card-pad" style="background:var(--accent);color:#fff;border:0"><span style="opacity:.85;font-size:14px">ยอดเงินคงเหลือ</span><div style="font-family:var(--font-head);font-size:36px;font-weight:700">฿250.00</div></div>
        <div class="card card-pad" style="margin-top:14px"><h3 style="font-size:16px;margin-bottom:12px">เติมเงินด้วยพร้อมเพย์</h3>
          <div class="chips" style="flex-wrap:wrap">${[50, 100, 300, 500, 1000].map((v, i) => `<button class="chip${i === 1 ? ' on' : ''}" onclick="$$('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${baht(v)}</button>`).join('')}</div>
          <button class="btn primary lg block" style="margin-top:14px" onclick="location.hash='cart/pay'">สร้าง QR พร้อมเพย์</button></div></div>`;
    },
  };

  // QR ตัวอย่าง (ลายสุ่ม ไม่ใช่ QR จริง)
  function qrDemo() {
    let s = '', seed = 7;
    const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
    for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
      const inFinder = (x < 8 && y < 8) || (x > 20 && y < 8) || (x < 8 && y > 20);
      if (!inFinder && r() > .52) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    return s + finder(0, 0) + finder(22, 0) + finder(0, 22);
  }

  // นับถอยหลัง QR
  setInterval(() => { const t = $('#tm'); if (!t) return; let [m, s] = t.textContent.split(':').map(Number); if (m + s === 0) return; s--; if (s < 0) { s = 59; m--; } t.textContent = `${m}:${String(s).padStart(2, '0')}`; }, 1000);

  initTheme();
  router(pages, 'home');
  syncCount();
</script>
</body>
</html>
